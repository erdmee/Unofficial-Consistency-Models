data:
  image_size: 32
  channels: 3
  data_dir: ./data/cifar10/train

model:
  model_channels: 128
  channel_mult: [1, 2, 2, 2]
  num_res_blocks: 4
  attention_resolutions: [16, 8]
  num_heads: 4
  dropout: 0.0
  num_classes: null

training:
  loss: lpips
  batch_size: 256
  lr: 0.0004
  max_steps: 100000
  use_fp16: false
  sampling_ema_decay: 0.9999

ct:
  s0: 2
  s1: 150
  mu0: 0.9

logging:
  ckpt_every: 5000
  log_every: 50
  out_dir: runs/cifar10_ct
  use_wandb: true
  wandb_project: consistency-models
  wandb_run_name: null  # null → auto-generated from config + timestamp

schedule:
  sigma_min: 0.002
  sigma_max: 80.0
  sigma_data: 0.5
  rho: 7.0